name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -cover ./...

  integration:
    name: Integration (DynamoDB/Floci)
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:1.5.34-compat
        ports:
          - 4566:4566
        env:
          FLOCI_DEFAULT_REGION: us-east-1
          FLOCI_STORAGE_MODE: memory
        options: >-
          --health-cmd "awslocal dynamodb list-tables"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Run integration tests
        run: go test -tags integration ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall

  coverage:
    name: New-code coverage (>=95%)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Unit tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce >=95% coverage on new code
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Composition root (cmd/api/main.go) wires live AWS clients and is
          # not unit-testable; exclude it from the new-code coverage gate.
          git diff -U0 --no-color "origin/${BASE_REF}...HEAD" \
            -- . ':(exclude)cmd/api/main.go' > coverage.patch
          go run github.com/seriousben/go-patch-cover/cmd/go-patch-cover@v0.2.0 \
            -o json coverage.out coverage.patch > coverage.patch.json
          cat coverage.patch.json
          n=$(jq -r '.patch_num_stmt' coverage.patch.json)
          cov=$(jq -r '.patch_coverage' coverage.patch.json)
          if [ "$n" -eq 0 ]; then
            echo "No new Go statements in this PR; coverage gate skipped."
            exit 0
          fi
          awk -v c="$cov" -v t="95" 'BEGIN{
            if (c+0 < t+0) { printf("FAIL: new-code coverage %.2f%% < %d%%\n", c, t); exit 1 }
            printf("OK: new-code coverage %.2f%% >= %d%%\n", c, t)
          }'
