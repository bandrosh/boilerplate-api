# Infrastructure-only stack. The Go application itself runs from your IDE
# (`go run ./cmd/api` or the debugger) and connects to these services on
# localhost. Bring it up with `make infra-up` / `docker compose up -d`.
name: boilerplate-api

services:
  localstack:
    image: localstack/localstack:3.8
    container_name: bp_localstack
    environment:
      SERVICES: dynamodb
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_TABLE: boilerplate
    ports:
      - "4566:4566"   # LocalStack edge / DynamoDB endpoint
    volumes:
      # Init scripts under ready.d run automatically once LocalStack is ready.
      - ./docker/localstack/init:/etc/localstack/init/ready.d:ro
      - localstackdata:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal dynamodb list-tables || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: bp_otel_collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./docker/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (the app exports here)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: bp_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: bp_tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API

  grafana:
    image: grafana/grafana:11.3.0
    container_name: bp_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  localstackdata:
  tempodata:
  grafanadata:
