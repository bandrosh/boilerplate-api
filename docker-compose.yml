# Infrastructure-only stack. The Go application itself runs from your IDE
# (`go run ./cmd/api` or the debugger) and connects to these services on
# localhost. Bring it up with `make infra-up` / `docker compose up -d`.
name: boilerplate-api

services:
  # Floci is a drop-in LocalStack replacement (same port, same wire protocol).
  # The `-compat` tag bundles the AWS CLI / awslocal used by the init script.
  floci:
    image: floci/floci:1.5.34-compat
    container_name: bp_floci
    environment:
      FLOCI_HOSTNAME: floci          # hostname used in URLs returned to other containers
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: hybrid     # in-memory with async flush to disk
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_TABLE: boilerplate
    ports:
      - "4566:4566"   # Floci edge / DynamoDB endpoint
    volumes:
      # Init scripts under ready.d run automatically once Floci is ready.
      - ./docker/floci/init:/etc/localstack/init/ready.d:ro
      # /app/data is Floci's default persistent path and is owned by the
      # non-root container user, so the named volume inherits its permissions.
      - flocidata:/app/data
    healthcheck:
      test: ["CMD-SHELL", "awslocal dynamodb list-tables || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:4.6.1
    container_name: bp_dynamodb_admin
    environment:
      DYNAMO_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8001:8001"   # DynamoDB Admin UI
    depends_on:
      - floci

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: bp_otel_collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./docker/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (the app exports here)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - jaeger

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: bp_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: bp_tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: bp_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI

  grafana:
    image: grafana/grafana:11.3.0
    container_name: bp_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  flocidata:
  tempodata:
  grafanadata:
