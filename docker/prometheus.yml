global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metrics forwarded by the OTEL Collector (app metrics arrive via OTLP).
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Prometheus self-monitoring.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
