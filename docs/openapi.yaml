openapi: 3.0.3
info:
  title: boilerplate-api
  description: >-
    REST API boilerplate in Go (Hexagonal + DDD-lite) with DynamoDB persistence.
    Example User resource with cursor-based pagination.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
    description: Local (app runs from the IDE; infra via Docker)
tags:
  - name: Health
  - name: Users
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: >-
        Returns 200 as long as the process is running. It does not touch any
        dependency, so it is safe to use as a Kubernetes liveness probe — a
        failure here means the process should be restarted.
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe (checks DynamoDB)
      description: >-
        Reports whether the service can serve traffic. It verifies DynamoDB
        connectivity (DescribeTable) within a short timeout; use it as a
        readiness probe so traffic is only routed once dependencies are reachable.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: up }
        "503":
          description: Not ready (a dependency is unavailable)
  /api/v1/users:
    post:
      tags: [Users]
      summary: Create a user
      description: >-
        Creates a new user from a name and a unique e-mail. The e-mail is
        normalized (trimmed/lower-cased) and validated; uniqueness is enforced
        atomically in DynamoDB, so a duplicate e-mail returns 409. Returns the
        created user with its generated id and timestamps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: A user with this e-mail already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error (missing name or invalid e-mail)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Users]
      summary: List users (cursor-paginated)
      description: >-
        Returns a page of users ordered by creation date (newest first). Use
        `limit` to size the page (default 20, max 100) and pass the `next_cursor`
        from a previous response as `cursor` to fetch the following page. An
        empty `next_cursor` means there are no more results.
      parameters:
        - name: limit
          in: query
          description: Maximum number of items to return (1–100, default 20).
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          description: Opaque pagination cursor returned as `next_cursor`.
          schema: { type: string }
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"
  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The user's UUID.
        schema: { type: string, format: uuid }
    get:
      tags: [Users]
      summary: Get a user by id
      description: >-
        Fetches a single user by its UUID. Returns 404 if no user exists with
        that id, or 400 if the id is not a valid UUID.
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Users]
      summary: Update a user's name
      description: >-
        Updates the mutable fields of a user (currently the name). The name is
        trimmed and must not be empty. Returns the updated user with a refreshed
        `updated_at`, or 404 if the user does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Users]
      summary: Delete a user
      description: >-
        Permanently deletes a user and releases its e-mail uniqueness lock, so
        the same e-mail can be reused afterwards. Returns 204 on success or 404
        if the user does not exist.
      responses:
        "204":
          description: Deleted
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Ada Lovelace }
        email: { type: string, format: email, example: ada@example.com }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, example: Ada Lovelace }
        email: { type: string, format: email, example: ada@example.com }
    UpdateUserRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Ada King }
    PaginatedUsers:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          description: Empty when there are no more pages
    Error:
      type: object
      properties:
        error: { type: string, example: not_found }
        message: { type: string }
